
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heart Lyrics ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #080008;
    overflow: hidden;
    height: 100vh;
    height: 100dvh;
    font-family: "Segoe UI", sans-serif;
}

#screen {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

.heart {
    position: absolute;
    width: 240px;
    height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    animation: floatUp 11s linear forwards;
    z-index: 2;
}

.heart::before {
    content: "❤️";
    position: absolute;
    font-size: 210px;
    filter: drop-shadow(0 0 22px #ff1744);
}

.lyric {
    position: relative;
    z-index: 2;
    color: white;
    font-size: 15px;
    font-weight: bold;
    width: 67%;
    overflow-wrap: break-word;
    text-shadow: 0 2px 8px #85001b;
}

.particle {
    position: absolute;
    bottom: -40px;
    animation: particleUp linear forwards;
    pointer-events: none;
    z-index: 1;
}

@keyframes floatUp {
    0% {
        transform: translateY(0) scale(.8);
        opacity: 0;
    }
    8% {
        opacity: 1;
    }
    85% {
        opacity: 1;
    }
    100% {
        transform: translateY(-125vh) scale(1);
        opacity: 0;
    }
}

@keyframes particleUp {
    from {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }
    10% {
        opacity: .85;
    }
    to {
        transform: translateY(-115vh) rotate(35deg);
        opacity: 0;
    }
}

@media (max-width: 600px) {
    .heart {
        width: 210px;
        height: 195px;
    }

    .heart::before {
        font-size: 180px;
    }

    .lyric {
        font-size: 13px;
    }
}
</style>
</head>

<body>
<div id="screen"></div>

<script>
const LYRICS = [
    "Masukkan lirik baris pertama di sini",
    "Masukkan lirik baris kedua di sini",
    "Masukkan lirik baris ketiga di sini",
    "Masukkan lirik baris keempat di sini",
    "Masukkan lirik baris kelima di sini",
    "Masukkan lirik baris keenam di sini",
    "Masukkan lirik baris ketujuh di sini"
];

// Waktu kemunculan setiap hati (detik)
const DELAYS = [0.3, 4, 9, 19, 25.5, 31.5, 35];

// Kecepatan mengetik setiap lirik
const SPEEDS = [50, 50, 60, 50, 40, 40, 50];

const COLORS = [
    "#ff1744",
    "#e60033",
    "#cc0033",
    "#ff3355",
    "#ff4d6d",
    "#b30027",
    "#ff6680"
];

const screen = document.getElementById("screen");
let started = false;

function createHeart(text, index) {
    const heart = document.createElement("div");
    heart.className = "heart";

    const lyric = document.createElement("div");
    lyric.className = "lyric";
    lyric.textContent = "";

    heart.appendChild(lyric);

    // Posisi otomatis menyesuaikan lebar layar
    const maxX = Math.max(0, screen.clientWidth - 220);
    heart.style.left = Math.random() * maxX + "px";
    heart.style.top = screen.clientHeight + "px";

    heart.style.setProperty("--heart-color", COLORS[index % COLORS.length]);
    heart.style.filter =
        "drop-shadow(0 0 10px " + COLORS[index % COLORS.length] + ")";

    screen.appendChild(heart);

    let charIndex = 0;

    const typing = setInterval(() => {
        if (charIndex < text.length) {
            lyric.textContent += text[charIndex];
            charIndex++;
        } else {
            clearInterval(typing);
        }
    }, SPEEDS[index] || 50);

    heart.addEventListener("animationend", () => {
        clearInterval(typing);
        heart.remove();
    });
}

function createParticle() {
    const particle = document.createElement("div");
    particle.className = "particle";
    particle.textContent = Math.random() > 0.5 ? "💕" : "❤️";
    particle.style.left = Math.random() * 100 + "%";
    particle.style.fontSize = (10 + Math.random() * 18) + "px";
    particle.style.animationDuration = (6 + Math.random() * 7) + "s";

    screen.appendChild(particle);

    particle.addEventListener("animationend", () => {
        particle.remove();
    });
}

function startAnimation() {
    if (started) return;
    started = true;

    LYRICS.forEach((text, index) => {
        setTimeout(() => {
            createHeart(text, index);
        }, DELAYS[index] * 1000);
    });

    setInterval(() => {
        if (screen.childElementCount < 70) {
            createParticle();
        }
    }, 220);
}

startAnimation();
</script>
</body>
</html>
